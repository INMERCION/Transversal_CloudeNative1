spring.application.name=auditoria-service

server.port=8889

spring.datasource.url=jdbc:h2:file:./data/auditoria
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

#Esto nos ayuda a configurar los reintentos en caso de que falle la conexión con RabbitMQ, para que no se pierdan los mensajes y se puedan procesar después.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10000

#Enviar mensajes rechazados a la DLQ
spring.rabbitmq.listener.simple.default-requeue-rejected=false