spring.application.name=rabbitmq-admin-service
server.port=8890

# Conexion AMQP
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# RabbitMQ Management HTTP API
app.rabbitmq.management-url=${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
app.rabbitmq.management-username=${RABBITMQ_MANAGEMENT_USERNAME:guest}
app.rabbitmq.management-password=${RABBITMQ_MANAGEMENT_PASSWORD:guest}
app.rabbitmq.vhost=${RABBITMQ_VHOST:/}

# Seguridad AWS Cognito
app.cognito.issuer=${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_cRb1mCRID}
app.cognito.client-id=${COGNITO_CLIENT_ID:2o7peo4lq97vcmjef00pokle7}

# Scope de administracion RabbitMQ
app.security.admin-scope=rs-api-rabbitmq/admin

# Frontend Angular local
app.cors.origin=${FRONTEND_ORIGIN:http://localhost:4200}
